name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# NOTE: this workflow is intentionally credential-free. It only builds/lints/
# renders static artifacts from source — no registry pushes, no cluster
# access, no secrets required.

jobs:
  java-build:
    name: java-build (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: mvn package (skip tests — none exist yet)
        working-directory: k8s-auth-demo/backend
        run: mvn -B package -DskipTests

  # frontend-build is intentionally skipped: k8s-auth-demo/frontend has no
  # package.json / build tooling. It is static HTML/CSS/JS
  # (src/index.html, src/app.js, src/styles.css) served as-is by Nginx per
  # frontend/Dockerfile — there is no npm install/build step to run. If a
  # bundler or package.json is introduced later, add a frontend-build job
  # here (checkout -> setup-node -> npm ci -> npm run build).

  helm-lint:
    name: helm-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.3

      - name: helm lint
        run: helm lint k8s-auth-demo/helm/poc-k8s-auth-demo

      - name: helm template
        run: |
          helm template ci k8s-auth-demo/helm/poc-k8s-auth-demo \
            --values k8s-auth-demo/helm/poc-k8s-auth-demo/values.yaml

  k8s-manifests:
    name: yamllint + kubeconform (k8s/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint

      - name: yamllint
        run: |
          yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}" \
            k8s-auth-demo/k8s/*.yaml

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: kubeconform
        run: |
          kubeconform -strict -summary k8s-auth-demo/k8s/*.yaml
