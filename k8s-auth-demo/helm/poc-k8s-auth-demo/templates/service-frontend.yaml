apiVersion: v1
kind: Service
metadata:
  name: {{ include "poc.fullname" . }}-frontend
  labels:
    app: {{ include "poc.fullname" . }}
    component: frontend
spec:
  type: {{ .Values.service.frontend.type }}
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: {{ .Values.service.frontend.port }}
      protocol: TCP
      name: http
      {{- if eq .Values.service.frontend.type "NodePort" }}
      nodePort: {{ .Values.service.frontend.nodePort }}
      {{- end }}
  selector:
    app: {{ include "poc.fullname" . }}
    component: frontend
