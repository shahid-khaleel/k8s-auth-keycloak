services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: sample-keycloak
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  backend:
    image: k8-sample-backend:1.0.0
    build:
      context: ./backend
    container_name: sample-backend
    depends_on:
      - keycloak
    ports:
      - "8080:8080"

  frontend:
    image: k8-sample-frontend:1.0.0
    build:
      context: ./frontend
    container_name: sample-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
